services:
  - type: web
    name: sehatsetu-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd backend && DJANGO_DEBUG=true python clean_data.py && DJANGO_DEBUG=true python manage.py collectstatic --noinput
    startCommand: cd backend && python manage.py migrate --noinput && python manage.py bootstrap_deployment_data && exec gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --access-logfile - --error-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sehatsetu-db
          property: connectionString

databases:
  - name: sehatsetu-db
    databaseName: sehatsetu
    user: sehatsetu
    plan: free
